<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>Microsoft Teams Meeting</title>

  <style>
    :root {
      --teams: #6264a7;
      --teams-deep: #4b2e83;
      --ink: #181c2a;
      --muted: #626979;
      --green: #19c768;
      --blue: #2f80ed;
      --danger: #e44747;
      --border: #e2e4ea;
      --panel: #f6f7f9;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: #fff;
    }

    body { padding-bottom: 96px; }

    button { font: inherit; }

    .topbar {
      height: 92px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #d9dbe1;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .brand, .top-actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .brand-name {
      font-size: clamp(1.25rem, 2vw, 1.9rem);
      font-weight: 500;
    }

    .teams-logo {
      width: 52px;
      height: 52px;
      flex: 0 0 auto;
    }

    .icon-btn {
      border: 0;
      background: transparent;
      color: #344057;
      padding: 7px;
      border-radius: 10px;
      cursor: pointer;
    }

    .icon-btn:hover { background: #f1f2f5; }
    .icon-btn svg { width: 29px; height: 29px; fill: currentColor; display: block; }

    .count {
      font-size: 1.3rem;
      color: #344057;
    }

    .meeting {
      width: min(1180px, calc(100% - 28px));
      margin: 22px auto 0;
    }

    .participant-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .participant {
      min-height: 390px;
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      background: #0d0f14;
      isolation: isolate;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
    }

    .participant.host,
    .participant.self {
      grid-column: 1 / -1;
    }

    .participant.host {
      min-height: 500px;
      background:
        radial-gradient(circle at 50% 42%, rgba(116, 86, 189, .82) 0 18%, transparent 18.5%),
        linear-gradient(135deg, #681ead 0%, #851cc1 54%, #30226f 100%);
    }

    .participant.purple {
      background:
        radial-gradient(circle at 50% 70%, rgba(107, 91, 186, .72) 0 17%, transparent 17.5%),
        linear-gradient(130deg, #4a36a7 0%, #6c22c3 65%, #3e217d 100%);
    }

    .participant.green {
      background:
        radial-gradient(circle at 50% 70%, rgba(5, 150, 93, .6) 0 17%, transparent 17.5%),
        linear-gradient(135deg, #086b42 0%, #07865d 62%, #055f4e 100%);
    }

    .participant.self {
      min-height: 500px;
      background: #090b10;
    }

    .avatar {
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
      width: 155px;
      height: 155px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #d9dde4;
      border: 26px solid rgba(105, 85, 174, .76);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .18);
    }

    .avatar img,
    .avatar svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .participant.green .avatar {
      border-color: rgba(1, 155, 96, .72);
    }

    .camera-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: none;
      background: #050608;
    }

    .camera-video.active { display: block; }

    .camera-placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 30px;
      color: white;
      background:
        radial-gradient(circle at 50% 40%, #171a22 0 0, #090a0e 60%);
    }

    .camera-placeholder.hidden { display: none; }

    .camera-placeholder svg {
      width: 76px;
      height: 76px;
      margin-bottom: 16px;
      fill: #fff;
      opacity: .9;
    }

    .camera-placeholder p {
      max-width: 560px;
      margin: 0;
      color: #d7dae2;
      font-size: 1rem;
      line-height: 1.5;
    }

    .camera-start {
      margin-top: 18px;
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      color: #fff;
      background: var(--teams);
      font-weight: 700;
      cursor: pointer;
    }

    .camera-start:hover { filter: brightness(1.08); }

    .namebar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      min-height: 72px;
      padding: 17px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,.91) 58%);
      z-index: 4;
    }

    .namebar .name {
      min-width: 0;
      font-size: clamp(1rem, 2.5vw, 1.45rem);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .host-badge {
      padding: 5px 9px;
      border-radius: 7px;
      background: #3b8df5;
      font-size: .95rem;
    }

    .menu {
      margin-left: auto;
      font-size: 2rem;
      line-height: .7;
      letter-spacing: 2px;
    }

    .voice-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 4px;
      height: 27px;
    }

    .voice-bars span {
      width: 5px;
      border-radius: 4px;
      background: #34e16e;
      animation: talk 720ms ease-in-out infinite alternate;
    }

    .voice-bars span:nth-child(1) { height: 25px; }
    .voice-bars span:nth-child(2) { height: 13px; animation-delay: 170ms; }
    .voice-bars span:nth-child(3) { height: 9px; animation-delay: 310ms; }

    @keyframes talk {
      to { height: 8px; opacity: .65; }
    }

    .toggle {
      position: absolute;
      right: 20px;
      top: 20px;
      z-index: 6;
      width: 68px;
      height: 38px;
      padding: 4px;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      background: #15ca68;
      box-shadow: 0 4px 14px rgba(0,0,0,.18);
    }

    .toggle::after {
      content: "";
      display: block;
      width: 30px;
      height: 30px;
      margin-left: 30px;
      border-radius: 50%;
      background: #fff;
      transition: margin .18s ease;
    }

    .toggle.off {
      background: #6f7480;
    }

    .toggle.off::after {
      margin-left: 0;
    }

    .joined-toast {
      position: fixed;
      z-index: 45;
      left: 50%;
      bottom: 118px;
      width: min(650px, calc(100% - 34px));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 20px 24px;
      border: 1px solid #d8dbe1;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(20, 24, 36, .24);
      transition: opacity .25s ease, transform .25s ease;
    }

    .joined-toast.hide {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 24px);
    }

    .toast-avatar {
      width: 68px;
      height: 68px;
      flex: 0 0 68px;
      overflow: hidden;
      border-radius: 50%;
      border: 4px solid #31c86c;
      background: #e5e7ec;
    }

    .toast-avatar img, .toast-avatar svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .joined-name {
      margin: 0;
      font-size: clamp(1.1rem, 3vw, 1.7rem);
    }

    .joined-time {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 1.1rem;
    }

    .online-dot {
      margin-left: auto;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #4fd887;
    }

    .controls {
      position: fixed;
      z-index: 40;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      width: min(760px, calc(100% - 32px));
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 12px 16px;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 30px;
      background: rgba(242, 223, 255, .82);
      box-shadow: 0 15px 45px rgba(30, 34, 45, .22);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .control {
      min-width: 50px;
      height: 50px;
      border: 0;
      border-radius: 15px;
      display: grid;
      place-items: center;
      cursor: pointer;
      background: rgba(255,255,255,.62);
      color: #172033;
    }

    .control:hover { background: #fff; }

    .control.active {
      background: #202536;
      color: #fff;
    }

    .control.danger {
      background: var(--danger);
      color: #fff;
    }

    .control svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    .permission-note {
      position: fixed;
      top: 106px;
      left: 50%;
      z-index: 55;
      transform: translateX(-50%);
      max-width: calc(100% - 30px);
      padding: 11px 15px;
      border-radius: 11px;
      background: #1f2433;
      color: #fff;
      box-shadow: 0 9px 24px rgba(0,0,0,.24);
      font-size: .92rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      text-align: center;
    }

    .permission-note.show { opacity: 1; }

    @media (max-width: 760px) {
      .topbar {
        height: 76px;
        padding: 0 14px;
      }

      .teams-logo {
        width: 43px;
        height: 43px;
      }

      .brand { gap: 10px; }
      .top-actions { gap: 8px; }
      .meeting { width: calc(100% - 16px); margin-top: 14px; }
      .participant-grid { gap: 12px; }
      .participant { min-height: 320px; border-radius: 16px; }
      .participant.host, .participant.self { min-height: 400px; }
      .avatar { width: 130px; height: 130px; border-width: 22px; }
      .joined-toast { bottom: 98px; padding: 15px; gap: 12px; }
      .toast-avatar { width: 55px; height: 55px; flex-basis: 55px; }
      .controls { bottom: 14px; }
    }

    @media (max-width: 540px) {
      .participant-grid { grid-template-columns: 1fr; }
      .participant.host, .participant.self { grid-column: auto; }
      .participant { min-height: 370px; }
      .top-actions .optional { display: none; }
      .brand-name { font-size: 1.25rem; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <svg class="teams-logo" viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="teamsGradient" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#9a8cff"/>
            <stop offset="1" stop-color="#4d2ed7"/>
          </linearGradient>
        </defs>
        <circle cx="49" cy="28" r="17" fill="url(#teamsGradient)"/>
        <circle cx="83" cy="37" r="15" fill="url(#teamsGradient)"/>
        <rect x="38" y="50" width="49" height="52" rx="14" fill="url(#teamsGradient)"/>
        <rect x="70" y="52" width="35" height="45" rx="14" fill="#5832dd"/>
        <rect x="15" y="54" width="49" height="43" rx="10" fill="#5148db"/>
        <text x="39.5" y="84" text-anchor="middle" font-size="29" font-weight="800"
              fill="#fff" font-family="Arial, sans-serif">T</text>
      </svg>
      <span class="brand-name">Microsoft Teams</span>
    </div>

    <div class="top-actions">
      <button class="icon-btn optional" aria-label="Open chat">
        <svg viewBox="0 0 24 24"><path d="M4 4h12a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4H9l-5 4v-4a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4Z"/></svg>
      </button>
      <button class="icon-btn" aria-label="Participants">
        <svg viewBox="0 0 24 24"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm8-1a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM2 21a7 7 0 0 1 14 0H2Zm13.5 0a8.5 8.5 0 0 0-2.2-5.7A6 6 0 0 1 22 20v1h-6.5Z"/></svg>
      </button>
      <span class="count">(4)</span>
    </div>
  </header>

  <div class="permission-note" id="permissionNote"></div>

  <main class="meeting">
    <section class="participant-grid">
      <article class="participant host">
        <button class="toggle" aria-label="Host camera enabled"></button>
        <div class="avatar">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <rect width="100" height="100" fill="#dce3ec"/>
            <circle cx="50" cy="35" r="21" fill="#efc4a8"/>
            <path d="M29 35c2-18 40-23 43 1-10-6-31-8-43-1Z" fill="#83654f"/>
            <rect x="23" y="56" width="54" height="50" rx="24" fill="#283a50"/>
            <path d="M36 56h28v42H36z" fill="#f6f6f7"/>
            <circle cx="43" cy="36" r="2.4" fill="#2e3238"/>
            <circle cx="57" cy="36" r="2.4" fill="#2e3238"/>
            <path d="M42 31H31m27 0h11m-21 0h4" stroke="#30343b" stroke-width="3" stroke-linecap="round"/>
            <rect x="32" y="28" width="15" height="10" rx="4" fill="none" stroke="#30343b" stroke-width="2"/>
            <rect x="53" y="28" width="15" height="10" rx="4" fill="none" stroke="#30343b" stroke-width="2"/>
          </svg>
        </div>
        <div class="namebar">
          <span class="voice-bars" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="name">Adelheid Schmidt</span>
          <span class="host-badge">Host</span>
          <span class="menu">⋮</span>
        </div>
      </article>

      <article class="participant self" id="cameraTile">
        <video id="cameraVideo" class="camera-video" autoplay playsinline muted></video>

        <div class="camera-placeholder" id="cameraPlaceholder">
          <div>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 5h11a3 3 0 0 1 3 3v1.2l4-2.2v10l-4-2.2V16a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Z"/>
            </svg>
            <p id="cameraMessage">
              Allow camera access when your browser asks. Browsers require your permission before a webpage can show the laptop camera.
            </p>
            <button class="camera-start" id="cameraStart" type="button">Turn on camera</button>
          </div>
        </div>

        <div class="namebar">
          <svg width="25" height="25" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 14a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v4a4 4 0 0 0 4 4Zm-7-4h2a5 5 0 0 0 10 0h2a7 7 0 0 1-6 6.92V21h-2v-4.08A7 7 0 0 1 5 10Z"/>
          </svg>
          <span class="name">Teflondon enterprise Ltd (You)</span>
          <span class="menu">⋮</span>
        </div>
      </article>

      <article class="participant purple">
        <button class="toggle" aria-label="James camera enabled"></button>
        <div class="avatar">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <rect width="100" height="100" fill="#875632"/>
            <circle cx="50" cy="34" r="19" fill="#c88c65"/>
            <path d="M31 30c4-18 38-20 40 2-12-8-29-8-40-2Z" fill="#241c1b"/>
            <path d="M28 55c12-15 32-16 44 0l7 45H21Z" fill="#1b1718"/>
            <path d="M41 52h18l8 48H33Z" fill="#f3f1ed"/>
          </svg>
        </div>
        <div class="namebar">
          <span class="voice-bars" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="name">James Wilson</span>
          <span class="menu">⋮</span>
        </div>
      </article>

      <article class="participant green">
        <div class="avatar">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <rect width="100" height="100" fill="#d9e0e6"/>
            <circle cx="50" cy="35" r="20" fill="#efc4a7"/>
            <path d="M30 34c2-18 39-21 41 1-12-7-29-8-41-1Z" fill="#b98556"/>
            <path d="M24 57h52v45H24Z" fill="#263b4e"/>
            <circle cx="43" cy="36" r="2.4" fill="#333"/>
            <circle cx="57" cy="36" r="2.4" fill="#333"/>
            <rect x="32" y="29" width="15" height="10" rx="4" fill="none" stroke="#30343b" stroke-width="2"/>
            <rect x="53" y="29" width="15" height="10" rx="4" fill="none" stroke="#30343b" stroke-width="2"/>
            <path d="M48 31h4" stroke="#30343b" stroke-width="2"/>
            <path d="M34 45c11 9 21 9 32 0-1 17-31 18-32 0Z" fill="#986445"/>
          </svg>
        </div>
        <div class="namebar">
          <svg width="25" height="25" viewBox="0 0 24 24" fill="#e44747" aria-hidden="true">
            <path d="m3.3 2 18.7 18.7-1.3 1.3-4.2-4.2A7 7 0 0 1 13 19.9V23h-2v-3.1A7 7 0 0 1 5 13h2a5 5 0 0 0 8 4l-2-2a5 5 0 0 1-6-5V7.8L2 3.3 3.3 2ZM12 2a4 4 0 0 1 4 4v4c0 .6-.1 1.2-.4 1.8L8 4.2A4 4 0 0 1 12 2Z"/>
          </svg>
          <span class="name">Alex Martinez</span>
          <span class="menu">⋮</span>
        </div>
      </article>
    </section>
  </main>

  <aside class="joined-toast" id="joinedToast">
    <div class="toast-avatar">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <rect width="100" height="100" fill="#d9e0e6"/>
        <circle cx="50" cy="35" r="20" fill="#efc4a7"/>
        <path d="M30 34c2-18 39-21 41 1-12-7-29-8-41-1Z" fill="#b98556"/>
        <path d="M24 57h52v45H24Z" fill="#263b4e"/>
        <rect x="32" y="29" width="15" height="10" rx="4" fill="none" stroke="#30343b" stroke-width="2"/>
        <rect x="53" y="29" width="15" height="10" rx="4" fill="none" stroke="#30343b" stroke-width="2"/>
      </svg>
    </div>
    <div>
      <p class="joined-name">Alex Martinez joined the meeting</p>
      <p class="joined-time" id="joinedTime">06:23 PM</p>
    </div>
    <span class="online-dot" aria-hidden="true"></span>
  </aside>

  <nav class="controls" aria-label="Meeting controls">
    <button class="control active" id="micButton" type="button" aria-label="Mute microphone">
      <svg viewBox="0 0 24 24"><path d="M12 14a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v4a4 4 0 0 0 4 4Zm-7-4h2a5 5 0 0 0 10 0h2a7 7 0 0 1-6 6.92V21h-2v-4.08A7 7 0 0 1 5 10Z"/></svg>
    </button>

    <button class="control active" id="cameraButton" type="button" aria-label="Toggle camera">
      <svg viewBox="0 0 24 24"><path d="M4 5h11a3 3 0 0 1 3 3v1.2l4-2.2v10l-4-2.2V16a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Z"/></svg>
    </button>

    <button class="control" id="voiceButton" type="button" aria-label="Play background meeting voices">
      <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4V9Zm12.5 0a4 4 0 0 1 0 6l-1.2-1.6a2 2 0 0 0 0-2.8L16.5 9Zm2.5-3a8 8 0 0 1 0 12l-1.2-1.6a6 6 0 0 0 0-8.8L19 6Z"/></svg>
    </button>

    <button class="control danger" id="hangupButton" type="button" aria-label="Leave meeting">
      <svg viewBox="0 0 24 24"><path d="M3.4 15.8c5.5-4.2 11.7-4.2 17.2 0 .8.6.9 1.8.2 2.5l-1.6 1.6c-.5.5-1.4.6-2 .1l-2.1-1.6a2 2 0 0 0-1.2-.4h-3.8a2 2 0 0 0-1.2.4L6.8 20c-.6.5-1.5.4-2-.1l-1.6-1.6a1.8 1.8 0 0 1 .2-2.5Z"/></svg>
    </button>
  </nav>

  <script>
    const video = document.getElementById("cameraVideo");
    const placeholder = document.getElementById("cameraPlaceholder");
    const cameraMessage = document.getElementById("cameraMessage");
    const cameraStart = document.getElementById("cameraStart");
    const cameraButton = document.getElementById("cameraButton");
    const micButton = document.getElementById("micButton");
    const voiceButton = document.getElementById("voiceButton");
    const hangupButton = document.getElementById("hangupButton");
    const joinedToast = document.getElementById("joinedToast");
    const joinedTime = document.getElementById("joinedTime");
    const permissionNote = document.getElementById("permissionNote");

    let mediaStream = null;
    let cameraEnabled = false;
    let micEnabled = true;
    let voicesPlaying = false;
    let speechTimer = null;

    joinedTime.textContent = new Intl.DateTimeFormat([], {
      hour: "2-digit",
      minute: "2-digit"
    }).format(new Date());

    setTimeout(() => joinedToast.classList.add("hide"), 5500);

    function notify(message) {
      permissionNote.textContent = message;
      permissionNote.classList.add("show");
      clearTimeout(permissionNote.timer);
      permissionNote.timer = setTimeout(() => {
        permissionNote.classList.remove("show");
      }, 3500);
    }

    async function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        cameraMessage.textContent =
          "Camera access is unavailable here. Open this page through HTTPS or localhost in a modern browser.";
        notify("Camera requires HTTPS or localhost.");
        return;
      }

      try {
        if (!mediaStream) {
          mediaStream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "user",
              width: { ideal: 1280 },
              height: { ideal: 720 }
            },
            audio: true
          });

          video.srcObject = mediaStream;
        }

        const videoTrack = mediaStream.getVideoTracks()[0];
        if (videoTrack) videoTrack.enabled = true;

        cameraEnabled = true;
        video.classList.add("active");
        placeholder.classList.add("hidden");
        cameraButton.classList.add("active");
      } catch (error) {
        console.error(error);
        cameraEnabled = false;
        video.classList.remove("active");
        placeholder.classList.remove("hidden");
        cameraButton.classList.remove("active");

        if (error.name === "NotAllowedError") {
          cameraMessage.textContent =
            "Camera permission was blocked. Use the browser address-bar permissions icon, allow Camera and Microphone, then press “Turn on camera”.";
          notify("Please allow camera permission in your browser.");
        } else if (error.name === "NotFoundError") {
          cameraMessage.textContent =
            "No camera was detected on this device.";
          notify("No camera was detected.");
        } else {
          cameraMessage.textContent =
            "The camera could not start. Make sure another app is not already using it.";
          notify("The camera could not start.");
        }
      }
    }

    function stopCamera() {
      if (!mediaStream) return;

      const videoTrack = mediaStream.getVideoTracks()[0];
      if (videoTrack) videoTrack.enabled = false;

      cameraEnabled = false;
      video.classList.remove("active");
      placeholder.classList.remove("hidden");
      cameraMessage.textContent = "Your camera is turned off.";
      cameraStart.textContent = "Turn on camera";
      cameraButton.classList.remove("active");
    }

    cameraStart.addEventListener("click", startCamera);

    cameraButton.addEventListener("click", async () => {
      if (cameraEnabled) {
        stopCamera();
      } else {
        await startCamera();
      }
    });

    micButton.addEventListener("click", () => {
      micEnabled = !micEnabled;
      micButton.classList.toggle("active", micEnabled);

      if (mediaStream) {
        mediaStream.getAudioTracks().forEach(track => {
          track.enabled = micEnabled;
        });
      }

      notify(micEnabled ? "Microphone is on." : "Microphone is muted.");
    });

    const meetingLines = [
      "Good evening everyone, can you hear me clearly?",
      "Yes, I can hear you. The presentation looks good.",
      "Let us begin with the project update for this week.",
      "I have shared the document in the meeting chat.",
      "Thank you. We can review the next milestone now.",
      "That sounds good. I agree with the proposed timeline."
    ];

    function speakNextLine() {
      if (!voicesPlaying || !("speechSynthesis" in window)) return;

      const line = meetingLines[Math.floor(Math.random() * meetingLines.length)];
      const utterance = new SpeechSynthesisUtterance(line);
      const voices = speechSynthesis.getVoices();

      if (voices.length) {
        const preferred = voices.filter(v => /^en/i.test(v.lang));
        utterance.voice = preferred[Math.floor(Math.random() * preferred.length)] || voices[0];
      }

      utterance.rate = 0.88 + Math.random() * 0.18;
      utterance.pitch = 0.9 + Math.random() * 0.2;
      utterance.volume = 0.22;

      speechSynthesis.speak(utterance);
      speechTimer = setTimeout(speakNextLine, 4200 + Math.random() * 4200);
    }

    function stopVoices() {
      voicesPlaying = false;
      clearTimeout(speechTimer);
      if ("speechSynthesis" in window) speechSynthesis.cancel();
      voiceButton.classList.remove("active");
      notify("Background meeting voices stopped.");
    }

    voiceButton.addEventListener("click", () => {
      if (!("speechSynthesis" in window)) {
        notify("This browser does not support generated speech.");
        return;
      }

      if (voicesPlaying) {
        stopVoices();
      } else {
        voicesPlaying = true;
        voiceButton.classList.add("active");
        notify("Background meeting voices started.");
        speakNextLine();
      }
    });

    hangupButton.addEventListener("click", () => {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      stopVoices();
      video.srcObject = null;
      cameraEnabled = false;
      video.classList.remove("active");
      placeholder.classList.remove("hidden");
      cameraMessage.textContent = "You have left the meeting.";
      cameraStart.style.display = "none";
      notify("Meeting ended.");
    });

    document.querySelectorAll(".toggle").forEach(toggle => {
      toggle.addEventListener("click", () => toggle.classList.toggle("off"));
    });

    /*
      Browsers never allow a webpage to bypass the camera permission prompt.
      This request runs automatically, but the user must still approve access.
    */
    window.addEventListener("load", () => {
      setTimeout(startCamera, 450);
    });

    window.addEventListener("beforeunload", () => {
      if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
      if ("speechSynthesis" in window) speechSynthesis.cancel();
    });
</script>
